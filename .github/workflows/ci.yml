name: CI

# Runs the full check suite on every PR targeting main and on every push to a
# branch that isn't main. Push-to-main is intentionally excluded — once the
# repo is on origin, main will be protected and the only path in is via PR.
on:
  pull_request:
    branches: [main]
  push:
    branches-ignore: [main]

# Cancel in-progress runs of the same workflow on the same ref. Saves runner
# minutes when a PR gets multiple pushes in quick succession.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (svelte-check + vitest + cargo test)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 needs webkit2gtk-4.1 + GTK3 + AppIndicator + librsvg + libxdo
      # to build on Linux. Without these the cargo build fails with cryptic
      # pkg-config errors. Pinned to ubuntu-22.04 because 24.04 changed the
      # webkit2gtk packaging in incompatible ways.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install npm packages
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
