name: CI

# PR-driven flow: CI runs on every PR targeting main, plus on push-to-main
# itself (a defence-in-depth check that catches bad rebases or merges).
# Feature-branch pushes don't run on their own — open a (draft) PR to get
# CI feedback. This avoids the GitHub quirk where push + pull_request events
# for the same commit produce two parallel runs (one then cancels the
# other, leaving a noisy "cancelled" red X on the PR forever).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel in-progress runs for the same branch. Without this, a push to a
# feature branch *and* the resulting PR event both run a separate job for
# the same commit. Keying on the branch name (rather than github.ref, which
# differs between push and pull_request events) lets push+PR share a group,
# so the later-firing event cancels the earlier one.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  check:
    name: check (svelte-check + vitest + cargo test)
    runs-on: ubuntu-22.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      # Tauri 2 needs webkit2gtk-4.1 + GTK3 + AppIndicator + librsvg + libxdo
      # to build on Linux. Without these the cargo build fails with cryptic
      # pkg-config errors. Pinned to ubuntu-22.04 because 24.04 changed the
      # webkit2gtk packaging in incompatible ways.
      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install npm packages
        run: npm ci

      - name: svelte-check
        run: npm run check

      - name: vitest
        run: npm test

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked
