[package]
name = "silex"
version = "0.2.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "silex_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-store = "2"
walkdir = "2"
gray_matter = "0.2"
sha2 = "0.10"
tempfile = "3"
notify = "6"
tauri-plugin-notification = "2"
portable-pty = "0.8"
trash = "5"
percent-encoding = "2"
tauri-plugin-process = "2"

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-updater = "2"

# Native UNUserNotificationCenter path: correct icon attribution and
# click-to-open, which tauri-plugin-notification can't do on desktop.
[target."cfg(target_os = \"macos\")".dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSBundle", "NSDictionary", "NSError", "NSString"] }
objc2-user-notifications = { version = "0.3", features = [
  "UNNotification",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationResponse",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
  "block2",
] }

